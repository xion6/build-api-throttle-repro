services:
  postgres:
    image: postgres:16
    container_name: throttle-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: throttle
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - log_connections=on
      - -c
      - log_disconnections=off
    volumes:
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d throttle"]
      interval: 1s
      timeout: 2s
      retries: 30
